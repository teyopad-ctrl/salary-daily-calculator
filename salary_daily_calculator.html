<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>คำนวณเงินเดือนรายวัน</title>
<style>
:root{--ink:#16445b;--sky:#bdebf5;--deep:#79cde1;--surface:rgba(255,255,255,.9);--calc:#e9f9fc;--deduct:#e7f3f8;--net:#c9f1f2}
*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;min-height:100vh;color:var(--ink);font-family:Tahoma,"Noto Sans Thai",sans-serif;background:radial-gradient(circle at 10% 0%,#fff 0 18%,transparent 42%),linear-gradient(135deg,#eafaff,#d3f2f8 48%,#f9fdff)}
.app{width:1130px;max-width:calc(100% - 40px);min-height:100vh;margin:auto;padding:12px 0;display:flex;align-items:center;justify-content:center}.card{width:100%;overflow:hidden;border:1px solid #fff;border-radius:20px;background:var(--surface);box-shadow:0 24px 70px #277e9e2e;backdrop-filter:blur(14px)}
.salary{padding:13px 20px;background:linear-gradient(120deg,#8bd9e9,#c9f2f7);border-bottom:1px solid #a8deea}.salary label{display:block;margin-bottom:5px;color:#276b80;font-size:12px;font-weight:bold}.salary input{width:100%;border:0;border-radius:11px;padding:7px 14px;outline:0;color:var(--ink);background:#ffffffdd;font:700 23px Tahoma;text-align:center}.salary .rate{margin-top:7px;color:#276b80;font-size:12px;text-align:center}
.table-wrap{overflow:auto;padding:0 12px 8px}table{width:100%;min-width:700px;border-collapse:separate;border-spacing:0 4px}th{padding:8px 10px 4px;color:#4d7787;font-size:12px}td{padding:0;text-align:center}td:first-child{border-radius:13px 0 0 13px}td:last-child{border-radius:0 13px 13px 0}.name{width:24%;padding:9px 10px;background:var(--sky);font-weight:bold}.entry-cell,.calc-cell{padding:3px 8px;background:#fff}.calc-cell{background:var(--calc)}.entry-cell input,.entry-cell select{width:100%;border:1px solid transparent;border-radius:8px;padding:6px 8px;outline:0;color:var(--ink);background:transparent;font:inherit;text-align:center;text-align-last:center}.entry-cell input:focus,.entry-cell select:focus{border-color:var(--deep);box-shadow:0 0 0 4px #79cde138;background:#fff}.total-row td{padding:9px 10px;background:#d8f2f6;font-weight:bold}.deduction td{background:var(--deduct)}.net-row td{padding:11px 10px;background:var(--net);color:#116376;font-size:18px;font-weight:800}.actions{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:0 20px 14px}.hint{color:#6b8795;font-size:12px}button{border:0;border-radius:12px;padding:11px 20px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#55b8d0,#388faa);font:bold 14px Tahoma;box-shadow:0 7px 16px #3a8faa38}
@media(max-width:700px){.app{width:100%;max-width:none;min-height:100svh;padding:8px;align-items:flex-start}.card{border-radius:16px}.salary{padding:12px}.table-wrap{overflow:visible;padding:0 4px 8px}table{min-width:0;font-size:clamp(10px,2.8vw,13px);table-layout:fixed}th{padding:8px 3px 4px;font-size:clamp(9px,2.4vw,12px)}.name{width:23%;padding:8px 3px}.entry-cell,.calc-cell{padding:2px}.entry-cell input,.entry-cell select{padding:6px 1px;font-size:inherit}.total-row td{padding:8px 3px}.net-row td{padding:10px 3px;font-size:clamp(14px,4vw,18px)}.actions{display:block;padding:0 12px 12px}.hint{margin-bottom:10px;font-size:10px}button{width:100%}}
</style>
<style>
  .entry-cell input { border:1px solid #c5e4ec; background:#fff; cursor:text; }
  .entry-cell input[readonly] { background:#edf7fa; color:#557987; }
  .entry-cell select { border:1px solid #c5e4ec; background:#fff; }
</style>
</head>
<body><main class="app"><section class="card">
<div class="salary"><label for="rate">ค่าแรงต่อวัน <span>(พิมพ์แก้ไขได้)</span></label><input id="rate" data-key="daily_rate" type="text" value="380" inputmode="decimal" autocomplete="off" spellcheck="false" autofocus><div class="rate">ฐานเงินเดือน = ค่าแรงต่อวัน × วันทำงาน</div></div>
<div class="table-wrap"><table><thead><tr><th>รายการ</th><th>จำนวนวัน</th><th>จำนวนชั่วโมง</th><th>เป็นเงิน</th><th>ชั่วโมงละ</th></tr></thead><tbody>
<tr><td class="name">วันทำงาน</td><td class="entry-cell"><select data-key="work_days"></select></td><td class="calc-cell" id="baseHours">0</td><td class="calc-cell" id="base">0</td><td class="calc-cell" id="baseHourly">0</td></tr>
<tr><td class="name">โอที 1</td><td class="entry-cell"><select data-key="ot1_days"></select></td><td class="calc-cell" id="hours1">0</td><td class="calc-cell" id="money1">0</td><td class="calc-cell" id="hourly1">0</td></tr>
<tr><td class="name">โอที 1.5</td><td class="entry-cell"><select data-key="ot15_days"></select></td><td class="calc-cell" id="hours2">0</td><td class="calc-cell" id="money2">0</td><td class="calc-cell" id="hourly2">0</td></tr>
<tr><td class="name">โอที 2</td><td class="entry-cell"><select data-key="ot2_days"></select></td><td class="calc-cell" id="hours3">0</td><td class="calc-cell" id="money3">0</td><td class="calc-cell" id="hourly3">0</td></tr>
<tr><td class="name">โอที 3</td><td class="entry-cell"><select data-key="ot3_days"></select></td><td class="calc-cell" id="hours4">0</td><td class="calc-cell" id="money4">0</td><td class="calc-cell" id="hourly4">0</td></tr>
<tr><td class="name">เบี้ยขยัน</td><td class="entry-cell"><input data-key="diligent" type="text" value="0" inputmode="decimal" autocomplete="off" spellcheck="false"></td><td class="calc-cell" id="money5" colspan="3">0</td></tr>
<tr><td class="name">ค่าข้าว</td><td class="entry-cell"><select data-key="meal_days"></select></td><td class="calc-cell" id="money6" colspan="2">0</td><td class="calc-cell">20</td></tr>
<tr><td class="name">ค่ารถ</td><td class="entry-cell"><select data-key="transport_days"><option selected>1</option></select></td><td class="calc-cell" id="money7" colspan="2">0</td><td class="calc-cell">375</td></tr>
<tr><td class="name">ค่ากะ</td><td class="entry-cell"><select data-key="shift_days"></select></td><td class="calc-cell" id="money8" colspan="2">0</td><td class="calc-cell">50</td></tr>
<tr class="total-row"><td>ค่าสกิล</td><td class="entry-cell"><input data-key="skill_days" type="text" value="0" inputmode="decimal" autocomplete="off"></td><td class="entry-cell"><input data-key="skill_rate" type="text" value="0" inputmode="decimal" autocomplete="off"></td><td id="skillMoney">0</td><td></td></tr>
<tr class="deduction"><td>หัก</td><td>ภาษี</td><td class="entry-cell"><input data-key="tax" type="text" value="419" inputmode="decimal" autocomplete="off" spellcheck="false"></td><td id="afterTax">0</td><td></td></tr>
<tr class="deduction"><td></td><td>กองทุน</td><td class="entry-cell"><select data-key="fund"><option value="0" selected>0%</option><option value="5">5%</option><option value="10">10%</option><option value="15">15%</option></select></td><td id="afterFund">0</td><td></td></tr>
<tr class="net-row"><td>ยอดสุทธิ</td><td></td><td></td><td id="net">0</td><td></td></tr>
</tbody></table></div><div class="actions"><div class="hint">ใช้ลูกศร, Enter หรือ Tab เพื่อย้ายช่องกรอก และพิมพ์ทับค่าเดิมได้ทันที</div><button id="reset">ล้างค่า</button></div>
</section></main>
<script>
const make=(key,values,selected)=>{const el=document.querySelector(`[data-key="${key}"]`);if(!el||el.tagName!=='SELECT'||el.options.length)return;values.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=key==='fund'?`${v}%`:v;if(String(v)===String(selected))o.selected=true;el.appendChild(o)})};
make('fund',[0,5,10,15],0);
['work_days','ot1_days','ot15_days','ot2_days','ot3_days','meal_days','transport_days','shift_days'].forEach(key=>{const old=document.querySelector(`[data-key="${key}"]`);if(old){const input=document.createElement('input');input.type='text';input.inputMode='decimal';input.autocomplete='off';input.dataset.key=key;input.value=old.value||'0';old.replaceWith(input)}});
document.querySelector('[data-key="tax"]').readOnly=true;
const fields=[...document.querySelectorAll('input[data-key],select[data-key],#rate')],get=k=>{const e=document.querySelector(`[data-key="${k}"]`);const v=parseFloat(e.value);return Number.isFinite(v)?v:0},fmt=x=>Math.abs(x-Math.round(x))<1e-9?Math.round(x).toLocaleString('en-US'):x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),put=(id,v)=>document.getElementById(id).textContent=fmt(v);
function calculate(){const rate=parseFloat(document.getElementById('rate').value)||0,work=get('work_days'),salary=rate*work,rates=[1,1.5,2,3],keys=['ot1_days','ot15_days','ot2_days','ot3_days'],per=[7,3,7,3];let total=0;put('baseHours',work*7);put('base',salary);put('baseHourly',rate);rates.forEach((r,i)=>{const h=get(keys[i])*per[i],hourly=rate/7*r,m=h*hourly;put(`hours${i+1}`,h);put(`money${i+1}`,m);put(`hourly${i+1}`,hourly);total+=m});const carAmount=get('transport_days')*375;[get('diligent'),get('meal_days')*20,carAmount,get('shift_days')*50].forEach((v,i)=>{put(`money${i+5}`,v);total+=v});const skillMoney=get('skill_days')*get('skill_rate');total+=skillMoney;put('skillMoney',skillMoney);const tax=(salary+carAmount)*0.05,fund=salary/2*get('fund')/100;document.querySelector('[data-key="tax"]').value=tax.toFixed(2);put('afterTax',total-tax);put('afterFund',total-tax-fund);put('net',total-tax-fund)}
fields.forEach((el,i)=>{el.addEventListener('focus',()=>{if(el.tagName==='INPUT')el.select()});el.addEventListener('input',calculate);el.addEventListener('change',calculate);if(el.tagName!=='INPUT')el.addEventListener('keydown',e=>{const d={ArrowLeft:-1,ArrowRight:1,Tab:1,Enter:1}[e.key];if(d){e.preventDefault();fields[Math.max(0,Math.min(fields.length-1,i+d))].focus()}})});
document.getElementById('reset').onclick=()=>{document.getElementById('rate').value=380;fields.forEach(e=>{if(e.tagName==='SELECT'&&e.dataset.key!=='transport_days')e.selectedIndex=0});['diligent','skill_days','skill_rate'].forEach(key=>document.querySelector(`[data-key="${key}"]`).value=0);document.querySelector('[data-key="tax"]').value=0;calculate();document.getElementById('rate').focus()};calculate();document.getElementById('rate').focus();document.getElementById('rate').select();
</script></body></html>
