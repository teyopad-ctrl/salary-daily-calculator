<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>คำนวณเงินเดือน</title>
  <style>
    :root {
      --ink: #16445b;
      --muted: #6b8795;
      --sky: #bdebf5;
      --sky-deep: #79cde1;
      --surface: rgba(255,255,255,.86);
      --line: #cfe8ef;
      --input: #ffffff;
      --calc: #e9f9fc;
      --deduct: #e7f3f8;
      --net: #c9f1f2;
      --shadow: 0 24px 70px rgba(39, 126, 158, .18);
    }
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Tahoma", "Noto Sans Thai", sans-serif;
      background:
        radial-gradient(circle at 10% 0%, #ffffff 0 18%, transparent 42%),
        linear-gradient(135deg, #eafaff 0%, #d3f2f8 48%, #f9fdff 100%);
    }
    .app { width:1130px; max-width:calc(100% - 40px); min-height:100vh; margin:0 auto; padding:12px 0; display:flex; align-items:center; justify-content:center; }
    .card { width:100%; overflow:hidden; border:1px solid rgba(255,255,255,.95); border-radius:20px; background:var(--surface); box-shadow:var(--shadow); backdrop-filter: blur(14px); }
    .salary { padding: 13px 20px; background: linear-gradient(120deg, #8bd9e9, #c9f2f7); border-bottom:1px solid #a8deea; }
    .salary label { display:block; margin-bottom:5px; color:#276b80; font-size:12px; font-weight:700; }
    .salary input { width:100%; border:0; outline:0; border-radius:11px; padding:7px 14px; color:var(--ink); background:rgba(255,255,255,.86); font:700 23px Tahoma; text-align:center; box-shadow: inset 0 1px 2px rgba(30,100,120,.08); }
    .table-wrap { overflow:auto; padding: 0 12px 8px; }
    table { width:100%; min-width:700px; border-collapse:separate; border-spacing:0 4px; }
    th { padding:8px 10px 4px; color:#4d7787; font-size:12px; font-weight:700; text-align:center; }
    td { padding:0; text-align:center; }
    td:first-child { border-radius:13px 0 0 13px; }
    td:last-child { border-radius:0 13px 13px 0; }
    .name { width:24%; padding:9px 10px; background:var(--sky); font-weight:700; }
    .entry-cell, .calc-cell { padding:3px 8px; background:var(--input); }
    .calc-cell { background:var(--calc); }
    .entry-cell input { width:100%; border:1px solid transparent; border-radius:8px; padding:6px 8px; outline:0; color:var(--ink); background:transparent; font:inherit; text-align:center; }
    .entry-cell input:focus, .salary input:focus { border-color:var(--sky-deep); box-shadow:0 0 0 4px rgba(121,205,225,.22); background:#fff; }
    .entry-cell select { width:100%; border:1px solid transparent; border-radius:8px; padding:6px 8px; outline:0; color:var(--ink); background:transparent; font:inherit; text-align:center; text-align-last:center; cursor:pointer; }
    .entry-cell select:focus { border-color:var(--sky-deep); box-shadow:0 0 0 4px rgba(121,205,225,.22); background:#fff; }
    .total-row td { background:#d8f2f6; padding:9px 10px; font-weight:700; }
    .deduction td { background:var(--deduct); }
    .net-row td { background:var(--net); padding:11px 10px; color:#116376; font-size:18px; font-weight:800; }
    .actions { display:flex; align-items:center; justify-content:space-between; gap:15px; padding: 0 20px 14px; }
    .hint { color:var(--muted); font-size:12px; }
    button { border:0; border-radius:12px; padding:11px 20px; cursor:pointer; color:#fff; background:linear-gradient(135deg,#55b8d0,#388faa); font:700 14px Tahoma; box-shadow:0 7px 16px rgba(58,143,170,.22); }
    button:hover { filter:brightness(1.05); transform:translateY(-1px); }
    @media (max-width: 700px) {
      .app { width:100%; max-width:none; min-height:100svh; padding:8px; align-items:flex-start; }
      .card { margin:0; border-radius:16px; }
      .salary { padding:12px; }
      .table-wrap { overflow:visible; padding:0 4px 8px; }
      table { min-width:0; font-size:clamp(10px, 2.8vw, 13px); table-layout:fixed; }
      th { padding:8px 3px 4px; font-size:clamp(9px, 2.4vw, 12px); }
      .name { width:23%; padding:8px 3px; }
      .entry-cell, .calc-cell { padding:2px 2px; }
      .entry-cell input { padding:6px 1px; font-size:inherit; }
      .total-row td { padding:8px 3px; }
      .net-row td { padding:10px 3px; font-size:clamp(14px, 4vw, 18px); }
      .actions { padding:0 12px 12px; display:block; }
      .hint { margin-bottom:10px; font-size:10px; }
      button { width:100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="salary"><label for="salary">ฐานเงินเดือน</label><input id="salary" data-key="salary" value="0" inputmode="decimal" autocomplete="off"></div>
      <div class="table-wrap"><table><thead><tr><th>รายการ</th><th>จำนวนวัน</th><th>จำนวนชั่วโมง</th><th>เป็นเงิน</th><th>ชั่วโมงละ</th></tr></thead><tbody>
        <tr><td class="name">โอที 1</td><td class="entry-cell"><input data-key="ot1_days" value="0"></td><td class="calc-cell" id="hours1">0</td><td class="calc-cell" id="money1">0</td><td class="calc-cell" id="hourly1">0</td></tr>
        <tr><td class="name">โอที 1.5</td><td class="entry-cell"><input data-key="ot15_days" value="0"></td><td class="calc-cell" id="hours2">0</td><td class="calc-cell" id="money2">0</td><td class="calc-cell" id="hourly2">0</td></tr>
        <tr><td class="name">โอที 2</td><td class="entry-cell"><input data-key="ot2_days" value="0"></td><td class="calc-cell" id="hours3">0</td><td class="calc-cell" id="money3">0</td><td class="calc-cell" id="hourly3">0</td></tr>
        <tr><td class="name">โอที 3</td><td class="entry-cell"><input data-key="ot3_days" value="0"></td><td class="calc-cell" id="hours4">0</td><td class="calc-cell" id="money4">0</td><td class="calc-cell" id="hourly4">0</td></tr>
        <tr><td class="name">เบี้ยขยัน</td><td class="entry-cell"><input data-key="diligent" value="0"></td><td class="calc-cell" id="money5" colspan="3">0</td></tr>
        <tr><td class="name">ค่าข้าว</td><td class="entry-cell"><input data-key="meal_days" value="0"></td><td class="calc-cell" id="money6" colspan="2">0</td><td class="calc-cell">20</td></tr>
        <tr><td class="name">ค่ารถ</td><td class="entry-cell"><input data-key="transport_days" value="0"></td><td class="calc-cell" id="money7" colspan="2">0</td><td class="calc-cell">375</td></tr>
        <tr><td class="name">ค่ากะ</td><td class="entry-cell"><input data-key="shift_days" value="0"></td><td class="calc-cell" id="money8" colspan="2">0</td><td class="calc-cell">50</td></tr>
        <tr class="total-row"><td>เงินเดือนครึ่ง</td><td id="half">0</td><td></td><td id="subtotal">0</td><td></td></tr>
        <tr class="deduction"><td>หัก</td><td>ภาษี</td><td class="entry-cell"><input data-key="tax" value="419"></td><td id="afterTax">0</td><td></td></tr>
        <tr class="deduction"><td></td><td>กองทุน</td><td class="entry-cell"><input data-key="fund" value="0"></td><td id="afterFund">0</td><td></td></tr>
        <tr class="net-row"><td>ยอดสุทธิ</td><td></td><td></td><td id="net">0</td><td></td></tr>
      </tbody></table></div>
      <div class="actions"><div class="hint">ใช้ ↑ ↓ ← → หรือ Tab เพื่อย้ายช่องกรอก และพิมพ์ทับค่าเดิมได้ทันที</div><button id="reset">ล้างค่า</button></div>
    </section>
  </main>
  <script>
    function makeDropdown(key, values, selected) {
      const old = document.querySelector(`[data-key="${key}"]`);
      if (!old || key === 'salary' || key === 'tax') return;
      const select = document.createElement('select');
      select.dataset.key = key;
      values.forEach(value => { const option = document.createElement('option'); option.value = value; option.textContent = key === 'fund' ? `${value}%` : value; if (String(value) === String(selected)) option.selected = true; select.appendChild(option); });
      old.replaceWith(select);
    }
    makeDropdown('ot1_days', Array.from({length:32}, (_, i) => i), 0);
    makeDropdown('ot15_days', Array.from({length:32}, (_, i) => i), 0);
    makeDropdown('ot2_days', Array.from({length:32}, (_, i) => i), 0);
    makeDropdown('ot3_days', Array.from({length:32}, (_, i) => i), 0);
    makeDropdown('diligent', [0, 700, 1000, 1500], 0);
    makeDropdown('meal_days', Array.from({length:32}, (_, i) => i), 0);
    makeDropdown('transport_days', [1], 1);
    makeDropdown('shift_days', Array.from({length:32}, (_, i) => i), 0);
    makeDropdown('fund', [0, 5, 10, 15], 0);
    const inputs = [...document.querySelectorAll('input[data-key], select[data-key]')];
    const n = key => { const x = parseFloat(document.querySelector(`[data-key="${key}"]`).value.replace(/,/g,'')); return Number.isFinite(x) ? x : 0; };
    const fmt = x => Math.abs(x - Math.round(x)) < 1e-9 ? Math.round(x).toLocaleString('en-US') : x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    const set = (id, value) => document.getElementById(id).textContent = fmt(value);
    function calculate() {
      const salary=n('salary'), rates=[1,1.5,2,3], keys=['ot1_days','ot15_days','ot2_days','ot3_days'], per=[7,3,7,3]; let total=salary/2;
      rates.forEach((rate,i)=>{ const hours=n(keys[i])*per[i], hourly=salary/30/7*rate, money=hours*hourly; set(`hours${i+1}`,hours);set(`money${i+1}`,money);set(`hourly${i+1}`,hourly);total+=money; });
      [n('diligent'),n('meal_days')*20,n('transport_days')*375,n('shift_days')*50].forEach((v,i)=>{set(`money${i+5}`,v);total+=v;});
      const fundAmount = salary / 2 * n('fund') / 100;
      set('half',salary/2);set('subtotal',total);set('afterTax',total-n('tax'));set('afterFund',total-n('tax')-fundAmount);set('net',total-n('tax')-fundAmount);
    }
    inputs.forEach((input,i)=>{ input.addEventListener('focus',()=>{ if (input.tagName === 'INPUT') input.select(); }); input.addEventListener('click',()=>{ if (input.tagName === 'INPUT') setTimeout(()=>input.select()); }); input.addEventListener('input',calculate); input.addEventListener('change',calculate); input.addEventListener('keydown',e=>{ const dir = input.tagName === 'INPUT' ? {ArrowUp:-1,ArrowLeft:-1,ArrowDown:1,ArrowRight:1,Tab:1,Enter:1}[e.key] : {ArrowLeft:-1,ArrowRight:1,Tab:1,Enter:1}[e.key]; if(dir){e.preventDefault(); inputs[Math.max(0,Math.min(inputs.length-1,i+dir))].focus();} }); });
    document.getElementById('reset').addEventListener('click',()=>{document.querySelector('[data-key="salary"]').value='0';document.querySelector('[data-key="tax"]').value='419';inputs.forEach(x=>{if(x.dataset.key!=='salary'&&x.dataset.key!=='tax') x.selectedIndex=0;});calculate();inputs[0].focus();}); calculate();
  </script>
</body>
</html>
